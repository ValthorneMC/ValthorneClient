[package]
name = "valthorne-builder"
version = "0.1.0"
edition = "2021"
description = "CLI para preparar y publicar el pack de mods/recursos de Valthorne"
authors = ["Valthorne"]

[[bin]]
name = "valthorne-builder"
path = "src/main.rs"

[dependencies]
zip = "8.0"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "macros"] }
anyhow = "1.0"
sha2 = "0.11"
walkdir = "2.3"
toml = "1.0"
chrono = { version = "0.4", features = ["serde"] }
md5 = "0.8"
glob = "0.3"
rust-s3 = { version = "0.38.0", default-features = false, features = ["tokio-rustls-tls"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
base64 = "0.23.1"
rand = "0.8"
