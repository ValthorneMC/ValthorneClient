[package]
name = "valthorneclient"
version = "1.1.4"
description = "Official client for the Valthorne Minecraft server."
authors = ["Valthorne"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "valthorneclient_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "fs", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
url = "2.4"
tauri-plugin-prevent-default = "5.0.0"
tauri-plugin-updater = "2.0"
zip = "8.0"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.11"
md5 = "0.8"
walkdir = "2.5"
num_cpus = "1.16"
sysinfo = "0.30"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-os = "2.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
rand = "0.10"
glob = "0.3"
dunce = "1.0"
urlencoding = "2.1"
once_cell = "1.19"
discord-rich-presence = "1.0"
png = "=0.18.1"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "std", "getrandom"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
semver = "1"

