<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cinzel+Decorative:wght@400;700;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Valthorne Client</title>
  </head>

  <body>
    <div id="root"></div>
    <div class="initial-loader"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #150e0a 0%, #241a30 55%, #0a0705 100%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        height: 100%;
        overflow: hidden;
      }

      #root {
        height: 100%;
        background: linear-gradient(135deg, #150e0a 0%, #241a30 55%, #0a0705 100%);
      }

      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #150e0a 0%, #241a30 55%, #0a0705 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .initial-loader::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid rgba(212, 175, 55, 0.15);
        border-top: 3px solid rgba(212, 175, 55, 0.85);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .initial-loader.hidden {
        display: none;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
